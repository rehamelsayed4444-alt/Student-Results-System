<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results Management System</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Page Header -->
        <div class="text-center mb-4">
            <h1>Student Results Management System</h1>
            <p>نظام إدارة نتائج الطلاب</p>
        </div>

        <!-- Student Form -->
        <div class="card shadow p-4 mb-4">

            <h3 class="mb-4">إضافة طالب جديد</h3>

            <div class="mb-3">
                <label for="studentName" class="form-label">
                    اسم الطالب
                </label>
                <input
                    type="text"
                    id="studentName"
                    class="form-control"
                    placeholder="أدخل اسم الطالب">
            </div>

            <div class="mb-3">
                <label for="grade1" class="form-label">
                    درجة المادة الأولى
                </label>
                <input
                    type="number"
                    id="grade1"
                    class="form-control"
                    placeholder="من 0 إلى 100">
            </div>

            <div class="mb-3">
                <label for="grade2" class="form-label">
                    درجة المادة الثانية
                </label>
                <input
                    type="number"
                    id="grade2"
                    class="form-control"
                    placeholder="من 0 إلى 100">
            </div>

            <div class="mb-3">
                <label for="grade3" class="form-label">
                    درجة المادة الثالثة
                </label>
                <input
                    type="number"
                    id="grade3"
                    class="form-control"
                    placeholder="من 0 إلى 100">
            </div>

            <div class="mb-3">
                <label for="attendance" class="form-label">
                    نسبة الحضور
                </label>
                <input
                    type="number"
                    id="attendance"
                    class="form-control"
                    placeholder="من 0 إلى 100">
            </div>

            <!-- Error Message -->
            <div
                id="errorMessage"
                class="text-danger mb-3"
                role="alert">
            </div>

            <!-- Control Buttons -->
            <button
                type="button"
                id="addStudent"
                class="btn btn-primary mb-3">
                إضافة طالب
            </button>

            <button
                type="button"
                id="mercyButton"
                class="btn btn-success">
                تفعيل لجنة الرأفة
            </button>

        </div>

        <!-- Students List -->
        <div class="card shadow p-4 mb-4">

            <h3 class="mb-3">قائمة الطلاب</h3>

            <div id="studentsList">
                <p>لم يتم إضافة أي طلاب حتى الآن.</p>
            </div>

        </div>

        <!-- Final Report -->
        <div class="card shadow p-4 mb-4">

            <h3 class="mb-3">التقرير النهائي للجنة الرأفة</h3>

            <div id="report">
                <p>سيظهر التقرير هنا بعد تفعيل لجنة الرأفة.</p>
            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="js/main.js"></script>

</body>
</html>
